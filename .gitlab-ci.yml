stages:
  - build
  - test
  - static-checks
  - docker-build

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
    - ./gradlew --version
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/libs/*.jar'
    expire_in: 1 week