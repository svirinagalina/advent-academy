stages:
  - build
  - test
  - static-checks
  - docker-build

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
    - ./gradlew --version
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/libs/*.jar'
    expire_in: 1 week
test:
  stage: test
  needs: ["build"]
  script:
    - ./gradlew test --no-daemon --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - '**/build/test-results/test/*.xml'
    paths:
      - '**/build/test-results/test/'
      - '**/build/reports/tests/test/'
    expire_in: 1 week