stages:
  - build
  - test
  - static-checks
  - docker-build

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
    - ./gradlew --version
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/libs/*.jar'
    expire_in: 1 week
test:
  stage: test
  needs: ["build"]
  script:
    - ./gradlew test --no-daemon --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - '**/build/test-results/test/*.xml'
    paths:
      - '**/build/test-results/test/'
      - '**/build/reports/tests/test/'
    expire_in: 1 week
static-checks:
  stage: static-checks
  needs: ["test"]
  script:
    # Явно запустим задачи качества, если они есть
    - ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest --no-daemon --stacktrace
    # А затем общую проверку, которая обычно включает и тесты, и проверки
    - ./gradlew check --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/reports/checkstyle/'
      - 'reports/spotbugs.html'
      - '**/build/reports/tests/test/'
    expire_in: 1 week
docker-build:
  stage: docker-build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["static-checks"]
  before_script:
    - apk add --no-cache bash findutils
  script:
    - echo "Searching for Dockerfiles..."
    - DOCKERFILES=$(find . -mindepth 2 -maxdepth 4 -name 'Dockerfile')
    - |
      if [ -z "$DOCKERFILES" ]; then
        echo "No Dockerfiles found, failing docker-build stage."
        exit 1
      fi
    - |
      for FILE in $DOCKERFILES; do
        SERVICE_DIR=$(dirname "$FILE")
        IMAGE_NAME="${CI_PROJECT_PATH_SLUG}-$(basename "$SERVICE_DIR"):${CI_COMMIT_SHORT_SHA}"
        echo "Building image: $IMAGE_NAME from $FILE (context: $SERVICE_DIR)"
        docker build -f "$FILE" -t "$IMAGE_NAME" "$SERVICE_DIR"
      done