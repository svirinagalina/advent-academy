# Active development: verify affected backend modules. No frontend job until it is merged.
stages:
  - build
  - test
  - static-checks
  - docker-build

variables:
  FULL_CI:
    value: "false"
    options: ["false", "true"]
    description: "Run all backend tests and static checks (Docker builds remain manual except for tags)."

default:
  image: eclipse-temurin:21-jdk
  interruptible: true
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^(dev|develop)$/ && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|master)$/'
      variables:
        FULL_CI: "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|develop|dev)$/'

# The Alpine helper also selects modules, so Java jobs do not need Git installed.
branch-sync-check:
  stage: .pre
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash git
  cache: []
  variables:
    GIT_DEPTH: "0"
  script:
    - bash ci/test-branch-sync.sh
    - bash ci/check-branch-sync.sh
    - bash ci/test-select-modules.sh
    - mkdir -p .ci-state
    - bash ci/select-modules.sh > .ci-state/modules.txt
    - cat .ci-state/modules.txt
  artifacts:
    paths: [.ci-state/modules.txt]
    expire_in: 1 day

.docker-test-services:
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_API_VERSION: "1.43"

backend-check:
  extends: .docker-test-services
  stage: test
  needs:
    - job: branch-sync-check
      artifacts: true
  rules:
    - if: '$FULL_CI == "true" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG'
      when: never
    - changes: &backend_changes
        - ".gitlab-ci.yml"
        - "ci/**/*"
        - "build.gradle"
        - "settings.gradle"
        - "gradle.properties"
        - "gradlew"
        - "gradlew.bat"
        - "gradle/**/*"
        - "platform/**/*"
        - "config/**/*"
        - "src/**/*"
        - "docker-compose*.yml"
        - ".dockerignore"
        - "docs/security/**/*"
        - "docs/adr/**/*"
        - "user-service/src/**/*"
        - "user-service/build.gradle"
        - "user-service/Dockerfile"
        - "user-service/Dockerfile.*"
        - "user-service/package*.json"
        - "user-service/scripts/**/*"
        - "content-service/src/**/*"
        - "content-service/build.gradle"
        - "content-service/Dockerfile"
        - "content-service/Dockerfile.*"
        - "content-service/package*.json"
        - "content-service/scripts/**/*"
        - "meeting-service/src/**/*"
        - "meeting-service/build.gradle"
        - "meeting-service/Dockerfile"
        - "meeting-service/Dockerfile.*"
        - "meeting-service/package*.json"
        - "meeting-service/scripts/**/*"
        - "api-gateway/src/**/*"
        - "api-gateway/build.gradle"
        - "api-gateway/Dockerfile"
        - "api-gateway/Dockerfile.*"
        - "api-gateway/package*.json"
        - "api-gateway/scripts/**/*"
  script:
    - bash ci/check-backend.sh
  artifacts:
    when: always
    paths:
      - '**/build/libs/*.jar'
      - '**/build/test-results/test/'
      - '**/build/reports/tests/test/'
      - '**/build/reports/checkstyle/'
    reports:
      junit:
        - '**/build/test-results/test/*.xml'
    expire_in: 1 week

security-contract:
  stage: test
  needs:
    - job: branch-sync-check
      artifacts: true
  rules:
    - if: '$FULL_CI == "true" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG'
      when: never
    - changes:
        - ".gitlab-ci.yml"
        - "ci/**/*"
        - "build.gradle"
        - "settings.gradle"
        - "gradle.properties"
        - "gradlew"
        - "gradlew.bat"
        - "gradle/**/*"
        - "platform/**/*"
        - "config/**/*"
        - "src/**/*"
        - "docker-compose*.yml"
        - ".dockerignore"
        - "docs/security/**/*"
        - "docs/adr/**/*"
        - "user-service/src/main/**/*"
        - "content-service/src/main/**/*"
        - "meeting-service/src/main/**/*"
        - "api-gateway/src/main/**/*"
        - "user-service/Dockerfile*"
        - "content-service/Dockerfile*"
        - "meeting-service/Dockerfile*"
        - "api-gateway/Dockerfile*"
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths: [.gradle/wrapper, .gradle/caches]
    policy: pull
  script:
    - ./gradlew securityContract --no-daemon --stacktrace
  artifacts:
    when: always
    reports:
      junit: ['build/test-results/securityContract/*.xml']
    paths:
      - build/test-results/securityContract/
      - build/reports/tests/securityContract/
    expire_in: 1 week

full-check:
  extends: .docker-test-services
  stage: test
  needs:
    - job: branch-sync-check
      artifacts: true
  rules:
    - if: '$FULL_CI == "true" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_TAG'
  script:
    - ./gradlew check securityContract assemble --no-daemon --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - '**/build/test-results/test/*.xml'
        - 'build/test-results/securityContract/*.xml'
    paths:
      - '**/build/libs/*.jar'
      - '**/build/test-results/'
      - '**/build/reports/'
      - reports/
    expire_in: 1 week

docker-build:
  stage: docker-build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash git
  cache: []
  needs:
    - job: branch-sync-check
      artifacts: true
    - job: backend-check
      optional: true
      artifacts: true
    - job: security-contract
      optional: true
      artifacts: false
    - job: full-check
      optional: true
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
      allow_failure: false
    - if: '$FULL_CI == "true" || $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - changes: *backend_changes
      when: manual
      allow_failure: true
  script:
    - bash ci/build-images.sh
