stages:
  - build
  - test
  - static-checks
  - docker-build

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
    - ./gradlew --version
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|develop)$/'