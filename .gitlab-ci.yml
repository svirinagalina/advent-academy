stages:
  - build
  - test
  - static-checks
  - docker-build

default:
  image: eclipse-temurin:21-jdk
  before_script:
    - export GRADLE_USER_HOME="$CI_PROJECT_DIR/.gradle"
    - chmod +x ./gradlew
    - ./gradlew --version
  cache:
    key: "${CI_PROJECT_NAME}-gradle"
    paths:
      - .gradle/wrapper
      - .gradle/caches
    policy: pull-push

branch-sync-check:
  stage: .pre
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  cache: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - TARGET_SHA="$(git rev-parse FETCH_HEAD)"
    - SOURCE_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
    - |
      if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
        echo "Source branch is behind $CI_MERGE_REQUEST_TARGET_BRANCH_NAME."
        echo "Rebase it onto the target branch and force-push the result."
        exit 1
      fi
    - |
      MERGE_COMMITS="$(git rev-list --merges "$TARGET_SHA..$SOURCE_SHA")"
      if [ -n "$MERGE_COMMITS" ]; then
        echo "Source branch contains merge commits after $CI_MERGE_REQUEST_TARGET_BRANCH_NAME."
        echo "Rebase it onto the target branch and force-push the result."
        git log --oneline --merges "$TARGET_SHA..$SOURCE_SHA"
        exit 1
      fi

build:
  stage: build
  script:
    - ./gradlew clean assemble --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/libs/*.jar'
    expire_in: 1 week
test:
  stage: test
  needs: ["build"]
  script:
    - ./gradlew test --no-daemon --stacktrace
  artifacts:
    when: always
    reports:
      junit:
        - '**/build/test-results/test/*.xml'
    paths:
      - '**/build/test-results/test/'
      - '**/build/reports/tests/test/'
    expire_in: 1 week
static-checks:
  stage: static-checks
  needs: ["test"]
  script:
    - ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest --no-daemon --stacktrace
    - ./gradlew check -x test --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - '**/build/reports/checkstyle/'
      - '**/build/reports/spotbugs/'
      - '**/build/reports/tests/test/'
    expire_in: 1 week
docker-build:
  stage: docker-build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["static-checks"]
  before_script:
    - apk add --no-cache bash findutils
  script:
    - echo "Searching for Dockerfiles..."
    - DOCKERFILES=$(find . -mindepth 2 -maxdepth 4 -name 'Dockerfile')
    - |
      if [ -z "$DOCKERFILES" ]; then
        echo "No Dockerfiles found, failing docker-build stage."
        exit 1
      fi
    - |
      for FILE in $DOCKERFILES; do
        SERVICE_DIR=$(dirname "$FILE")
        IMAGE_NAME="${CI_PROJECT_PATH_SLUG}-$(basename "$SERVICE_DIR"):${CI_COMMIT_SHORT_SHA}"
        echo "Building image: $IMAGE_NAME from $FILE (context: $SERVICE_DIR)"
        docker build -f "$FILE" -t "$IMAGE_NAME" .
      done
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|develop|dev)$/'
