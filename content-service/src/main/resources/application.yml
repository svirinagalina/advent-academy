spring:
  application:
    name: content-service
  profiles:
    active: docker
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: content
  flyway:
    enabled: true
    schemas: content
    default-schema: content
    create-schemas: true
    table: flyway_schema_history_content
    locations: classpath:db/migration

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db, diskSpace
        liveness:
          include: ping
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.adventacademy: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:advent-academy-user-service}
    audience: ${JWT_AUDIENCE:advent-academy-services}
    clock-skew-seconds: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

content:
  upload:
    max-file-size-bytes: 5242880  # 5 MiB, applies to the uploaded .md or .zip file itself
    archive:
      max-total-uncompressed-bytes: 20971520  # 20 MiB, protects against zip bombs
      max-entry-count: 50

asset:
  upload:
    max-file-size-bytes: 10485760  # 10 MiB
    allowed-mime-types:
      - image/png
      - image/jpeg
      - image/jpg
      - image/gif
      - image/svg+xml
      - image/webp
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/zip
      - application/x-zip-compressed
      - text/plain
      - video/mp4
      - video/mpeg
      - audio/mpeg
      - audio/mp3