spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS content
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

logging:
  level:
    com.adventacademy: INFO

content:
  upload:
    max-file-size-bytes: 5242880  # 5 MiB

asset:
  upload:
    max-file-size-bytes: 10485760  # 10 MiB
    allowed-mime-types:
      - image/png
      - image/jpeg
      - image/jpg
      - image/gif
      - image/svg+xml
      - image/webp
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/zip
      - application/x-zip-compressed
      - text/plain
      - video/mp4
      - video/mpeg
      - audio/mpeg
      - audio/mp3

security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-32-bytes
    issuer: advent-academy-user-service
    audience: advent-academy-services
    clock-skew-seconds: 30