security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-32-bytes
    issuer: advent-academy-user-service
    audience: advent-academy-services
    clock-skew-seconds: 30

meeting:
  allowed-origins:
    - http://localhost:8084
    - http://127.0.0.1:8084
  max-message-bytes: 65536
  capability-ttl-seconds: 60
  room-creation-limit-per-minute: 100
  capability-limit-per-minute: 100
  join-limit-per-minute: 100
  ice-servers: []

spring:
  datasource:
    url: jdbc:h2:mem:meeting-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    schemas: meeting
    default-schema: meeting
    table: flyway_schema_history_meeting
