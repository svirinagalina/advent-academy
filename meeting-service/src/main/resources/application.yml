spring:
  application:
    name: meeting-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:advent_academy}
    username: ${POSTGRES_USER:advent_user}
    password: ${POSTGRES_PASSWORD}
  flyway:
    schemas: meeting
    default-schema: meeting
    table: flyway_schema_history_meeting

server:
  port: 8084

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: db, diskSpace

meeting:
  allowed-origins: ${MEETING_ALLOWED_ORIGINS:http://localhost:8084,http://127.0.0.1:8084,http://localhost:3000,http://localhost:3001}
  content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8081}
  max-message-bytes: 65536
  capability-ttl-seconds: 60
  room-creation-limit-per-minute: 10
  capability-limit-per-minute: 30
  join-limit-per-minute: 20
  ice-servers: []

security:
  jwt:
    secret: ${JWT_SECRET:}
    private-key-file: ${JWT_PRIVATE_KEY_FILE:}
    public-key-file: ${JWT_PUBLIC_KEY_FILE:}
    key-id: ${JWT_KEY_ID:}
    previous-public-key-file: ${JWT_PREVIOUS_PUBLIC_KEY_FILE:}
    previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
    issuer: ${JWT_ISSUER:advent-academy-user-service}
    audience: ${JWT_AUDIENCE:advent-academy-services}
    clock-skew-seconds: 30

logging:
  level:
    com.adventacademy.meetingservice: INFO
