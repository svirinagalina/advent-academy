spring:
  application:
    name: meeting-service

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

meeting:
  allowed-origins:
    - http://localhost:8084
    - http://127.0.0.1:8084
  max-message-bytes: 65536
  ice-servers: []

logging:
  level:
    com.adventacademy.meetingservice: INFO
