# Local development only. This stack disables authentication for selected components
# and uses resource-saving settings that are not suitable for production deployments.
services:
  frontend:
    profiles: ["frontend"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_GATEWAY_URL: http://api-gateway:8090
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
      MEETING_SIGNALING_URL: ${MEETING_SIGNALING_URL:-ws://localhost:8090/ws/meetings}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - advent-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    platform: linux/amd64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - advent-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - advent-network

  postgres:
    image: postgres:16-alpine
    container_name: advent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - advent-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.10}
    container_name: advent-elasticsearch
    environment:
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - advent-network

  zeebe:
    image: camunda/zeebe:${CAMUNDA_VERSION:-8.7.35}
    container_name: advent-zeebe
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE: 1
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: 0.998
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: 0.999
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:9600:9600"
    volumes:
      - zeebe_data:/usr/local/zeebe/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q 'http://localhost:9600/actuator/health/readiness'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - advent-network

  operate:
    image: camunda/operate:${CAMUNDA_VERSION:-8.7.35}
    container_name: advent-operate
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_CSRFPREVENTIONENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q 'http://localhost:9600/actuator/health/readiness'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - advent-network

  tasklist:
    image: camunda/tasklist:${CAMUNDA_VERSION:-8.7.35}
    container_name: advent-tasklist
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_TASKLIST_ZEEBE_RESTADDRESS: http://zeebe:8080
      CAMUNDA_TASKLIST_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_TASKLIST_CSRFPREVENTIONENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q 'http://localhost:9600/actuator/health/readiness'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - advent-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      network: host
    container_name: advent-user-service
    depends_on:
      postgres:
        condition: service_healthy
      zeebe:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      # AES-256 key for TOTP secrets at rest: `openssl rand -base64 32`. No default on purpose.
      MFA_ENCRYPTION_KEY_V1: ${MFA_ENCRYPTION_KEY_V1}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONTENT_SERVICE_URL: http://content-service:8081
      CAMUNDA_CLIENT_MODE: self-managed
      CAMUNDA_CLIENT_ZEEBE_ENABLED: "true"
      CAMUNDA_CLIENT_ZEEBE_GRPCADDRESS: http://zeebe:26500
      CAMUNDA_CLIENT_ZEEBE_RESTADDRESS: http://zeebe:8080
      CAMUNDA_CLIENT_ZEEBE_PREFERRESTOVERGRPC: "false"
      JAVA_TOOL_OPTIONS: ${USER_SERVICE_JAVA_OPTS:--agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - advent-network

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
      network: host
    container_name: advent-content-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8080
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - advent-network

  meeting-service:
    build:
      context: .
      dockerfile: meeting-service/Dockerfile
      network: host
    container_name: advent-meeting-service
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONTENT_SERVICE_URL: http://content-service:8081
      MEETING_ALLOWED_ORIGINS: ${MEETING_ALLOWED_ORIGINS:-http://localhost:8084,http://127.0.0.1:8084,http://localhost:3000,http://localhost:3001}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - advent-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      network: host
    container_name: advent-api-gateway
    depends_on:
      user-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      meeting-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:8080
      CONTENT_SERVICE_URL: http://content-service:8081
      MEETING_SERVICE_URL: http://meeting-service:8084
      MEETING_SERVICE_WS_URL: ws://meeting-service:8084
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - advent-network

volumes:
  postgres_data:
  elasticsearch_data:
  zeebe_data:

networks:
  advent-network:
    driver: bridge
