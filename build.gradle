plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    id 'checkstyle'
    alias(libs.plugins.spotbugs)
}

group = 'com.adventacademy'
version = '0.0.1-SNAPSHOT'
description = 'advent-academy'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

checkstyle {
    toolVersion = libs.versions.checkstyle.tool.get()
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

configurations.checkstyle {
    resolutionStrategy.capabilitiesResolution.withCapability('com.google.collections:google-collections') {
        select('com.google.guava:guava:0')
    }
}

tasks.spotbugsMain {
    reports.create("html") {
        required = true
        outputLocation = file("$rootDir/reports/spotbugs.html")
        setStylesheet("fancy-hist.xsl")
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(project(':platform'))
    // annotationProcessor is a separate root configuration that does not
    // extend implementation, so the platform must be added to it too, or
    // managed annotationProcessor-only dependencies (lombok here) resolve
    // with no version at all.
    annotationProcessor platform(project(':platform'))
    // developmentOnly is another root configuration (added by the Boot
    // plugin itself) that doesn't extend implementation.
    developmentOnly platform(project(':platform'))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'

    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}
