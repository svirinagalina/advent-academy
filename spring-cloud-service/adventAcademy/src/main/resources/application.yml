spring:
  application:
    name: user-service
  profiles:
    active: docker
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:advent_academy}
    username: ${POSTGRES_USER:advent_user}
    password: ${POSTGRES_PASSWORD:advent_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-use-at-least-32-characters}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 30

logging:
  level:
    com.adventacademy: DEBUG
    org.springframework.security: DEBUG
