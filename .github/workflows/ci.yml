# GitHub Actions port of .gitlab-ci.yml: backend + frontend checks on every push/PR,
# Docker image builds on tags and manual runs.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradle/**'
              - 'platform/**'
              - 'security-common/**'
              - 'config/**'
              - 'src/**'
              - 'docs/security/**'
              - 'docs/adr/**'
              - 'user-service/**'
              - 'content-service/**'
              - 'meeting-service/**'
              - 'api-gateway/**'
              - 'docker-compose*.yml'
              - '.dockerignore'
            frontend:
              - '.github/workflows/**'
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # Testcontainers uses the runner's Docker daemon directly; no DinD needed.
      - run: ./gradlew check securityContract assemble --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-reports
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build

  docker-build:
    needs: [backend, frontend]
    if: |
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [user-service, content-service, meeting-service, api-gateway, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: false
          tags: advent-academy-${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
