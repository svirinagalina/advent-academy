// Project-wide dependency BOM. Every service consumes this via
// `implementation platform(project(':platform'))` instead of hardcoding its
// own dependency versions — see the root README's "Dependency management"
// section for how to add or bump a managed version.
//
// Spring Boot's own BOM is deliberately *not* re-imported here: each service
// already gets it through its own `org.springframework.boot` +
// `io.spring.dependency-management` plugins (whose *versions* are
// centralized separately, in gradle/libs.versions.toml — a java-platform
// project can't manage plugin versions at all). Duplicating spring-boot-
// dependencies here would just create a second, confusable source of truth
// for the same versions.
plugins {
    id 'java-platform'
}

group = 'com.adventacademy'
description = 'Dependency BOM for advent-academy services'

javaPlatform {
    // Needed to compose Spring Cloud's own BOM into ours below — a plain
    // java-platform project can only declare constraints unless this is set.
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.4.1')
    api platform('org.springframework.cloud:spring-cloud-dependencies:2024.0.0')

    constraints {
        // Camunda 8 / Zeebe
        api 'io.camunda:spring-boot-starter-camunda-sdk:8.7.35'
        api 'io.camunda:spring-boot-starter-camunda-test-testcontainer:8.7.35'

        // OpenAPI / Swagger
        api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
        api 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.7.0'

        // JWT
        api 'io.jsonwebtoken:jjwt-api:0.12.3'
        api 'io.jsonwebtoken:jjwt-impl:0.12.3'
        api 'io.jsonwebtoken:jjwt-jackson:0.12.3'

        // Markdown rendering and sanitization (content-service)
        api 'org.commonmark:commonmark:0.28.0'
        api 'org.commonmark:commonmark-ext-gfm-tables:0.28.0'
        api 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1'

        // SQL tracing via slf4j (user-service, local profile only)
        api 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.2'

        // Testcontainers — one version project-wide, current (2.x) module
        // coordinates. 2.0.5 is what io.camunda:zeebe-process-test-extension-
        // testcontainer:8.7.35 actually needs. Uses strictly(): a plain
        // constraint version here loses to whatever (older) version
        // io.spring.dependency-management injects from spring-boot-
        // dependencies for the same coordinate — confirmed by dependencyInsight
        // showing 1.20.4 winning over a plain 2.0.5 constraint. strictly()
        // is what actually wins that fight.
        api('org.testcontainers:testcontainers') {
            version { strictly '2.0.5' }
        }
        api('org.testcontainers:testcontainers-postgresql') {
            version { strictly '2.0.5' }
        }
        api('org.testcontainers:testcontainers-junit-jupiter') {
            version { strictly '2.0.5' }
        }

        // Test-only tooling
        api 'com.tngtech.archunit:archunit-junit5:1.3.0'
        api 'org.wiremock:wiremock-standalone:3.10.0'
    }
}
