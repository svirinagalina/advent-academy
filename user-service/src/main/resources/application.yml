show-sql: false

# DataSource decoration (p6spy) is off by default — only the local profile
# turns it on, so production runs with a plain HikariDataSource and zero
# proxy overhead.
decorator:
  datasource:
    enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-use-at-least-32-characters}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db, diskSpace
        liveness:
          include: ping
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.adventacademy: INFO
    org.springframework.security: WARN
  structured:
    format:
      console: logstash
  include-application-name: true
  pattern:
    correlation: "[requestId=%mdc{requestId:-}] "