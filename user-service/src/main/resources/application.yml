spring:
  application:
    name: user-service
  profiles:
    active: docker
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false

# DataSource decoration (p6spy) is off by default — only the local profile
# turns it on, so production runs with a plain HikariDataSource and zero
# proxy overhead.
decorator:
  datasource:
    enabled: false

camunda:
  client:
    zeebe:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:advent-academy-user-service}
    audience: ${JWT_AUDIENCE:advent-academy-services}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
    clock-skew-seconds: 30
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 30
  mfa:
    totp-time-step-seconds: 30
    totp-window-size: 1          # ±1 window (total ±30 seconds tolerance)
    recovery-code-count: 8       # Number of recovery codes to generate per MFA enrollment

app:
  email:
    from: ${EMAIL_FROM:noreply@adventacademy.com}
  baseurl: ${APP_BASE_URL:http://localhost:3000}

management:
  health:
    zeebe:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: db, diskSpace
        liveness:
          include: ping
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.adventacademy: INFO
    org.springframework.security: WARN
  structured:
    format:
      console: logstash
    include-application-name: true
  pattern:
    correlation: "[requestId=%mdc{requestId:-}] "
