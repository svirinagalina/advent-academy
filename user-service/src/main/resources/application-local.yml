spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:advent_academy}
    username: ${POSTGRES_USER:advent_user}
    password: ${POSTGRES_PASSWORD:advent_password}
    driver-class-name: org.postgresql.Driver
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME:admin}
      password: ${SPRING_SECURITY_USER_PASSWORD:admin}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Route SQL through slf4j (p6spy) so each statement is tagged with the
# requestId MDC entry from RequestIdFilter and lines up with the
# request/error log under the same X-Request-Id.
decorator:
  datasource:
    enabled: true
    p6spy:
      enable-logging: true
      logging: slf4j

logging:
  level:
    com.adventacademy: INFO
    # p6spy logger — set to DEBUG locally to see each SQL with its requestId.
    p6spy: DEBUG
    # Enable on demand when debugging auth:
    # org.springframework.security: DEBUG
  structured:
    format:
      console:
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"