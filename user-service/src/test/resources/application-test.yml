spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-32-bytes
    issuer: advent-academy-user-service
    audience: advent-academy-services
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 30

camunda:
  client:
    zeebe:
      enabled: false

management:
  health:
    zeebe:
      enabled: false

logging:
  structured:
    format:
      console:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    com.adventacademy: INFO
