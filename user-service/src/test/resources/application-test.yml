spring:
  mail:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

security:
  refresh-receipts:
    cleanup-enabled: false
  jwt:
    secret: test-secret-key-for-testing-purposes-only-32-bytes
    issuer: advent-academy-user-service
    audience: advent-academy-services
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 30
  mfa:
    totp-window-size: 1
    recovery-code-count: 8
    encryption:
      active-key: v1
      keys:
        v1: dGVzdC1tZmEtZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=
  tokens:
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  rate-limit:
    enabled: true
    window: 1h
    login-per-ip: 20
    login-per-account: 10
    register-per-ip: 10
    password-reset-per-ip: 5
    password-reset-per-account: 3
    resend-verification-per-ip: 5
    resend-verification-per-account: 3

camunda:
  client:
    zeebe:
      enabled: false

management:
  health:
    zeebe:
      enabled: false

logging:
  structured:
    format:
      console:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    com.adventacademy: INFO
